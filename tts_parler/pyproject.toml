[project]
name = "second-ear-tts-parler"
version = "0.1.0"
description = "Tamil speech synthesis for Second Ear dev dialogues (Indic Parler-TTS, Apache 2.0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # parler-tts pins transformers==4.46.1; commit pinned for reproducibility
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68",
    # descript-audiotools (a parler-tts dependency) predates torchaudio's I/O removal, so this env stays on
    # torch/torchaudio 2.8 (CUDA 12.8 build, which supports the RTX 5090) instead of 2.14
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile>=0.13",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
